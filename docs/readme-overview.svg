<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How libpetri turns a model into checked execution</title>
  <desc id="desc">Four language APIs compose reusable coloured timed Petri nets. A bitmap reference executor and a precompiled production executor run the same model. Specification tests, SMT analysis, and Lean proofs provide complementary evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .copy { fill: #475569; font-size: 16px; }
      .label { fill: #334155; font-size: 15px; font-weight: 650; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #dbe2ea; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>

  <g aria-label="Language APIs">
    <rect class="pill" x="95" y="34" width="112" height="42" rx="21"/>
    <text class="label" x="151" y="61" text-anchor="middle">Java</text>
    <rect class="pill" x="219" y="34" width="132" height="42" rx="21"/>
    <text class="label" x="285" y="61" text-anchor="middle">TypeScript</text>
    <rect class="pill" x="363" y="34" width="112" height="42" rx="21"/>
    <text class="label" x="419" y="61" text-anchor="middle">Rust</text>
    <rect class="pill" x="487" y="34" width="112" height="42" rx="21"/>
    <text class="label" x="543" y="61" text-anchor="middle">Python</text>
    <path d="M319 78v32" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="copy" x="625" y="61">one shared behavioral contract</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="45" y="120" width="330" height="250" rx="18"/>
    <rect x="45" y="120" width="330" height="8" rx="4" fill="#4f46e5"/>
    <text class="heading" x="75" y="169">1 · Compose</text>
    <text class="copy" x="75" y="198">Reusable, typed subnets</text>

    <circle cx="118" cy="263" r="21" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <rect x="188" y="241" width="48" height="44" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <circle cx="306" cy="263" r="21" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <path d="M140 263h40M238 263h43" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text class="label" x="118" y="316" text-anchor="middle">places</text>
    <text class="label" x="212" y="316" text-anchor="middle">work</text>
    <text class="label" x="306" y="316" text-anchor="middle">tokens</text>
    <text class="copy" x="75" y="349">ports · channels · timing · identity</text>

    <rect class="card" x="435" y="120" width="330" height="250" rx="18"/>
    <rect x="435" y="120" width="330" height="8" rx="4" fill="#0f766e"/>
    <text class="heading" x="465" y="169">2 · Execute</text>
    <text class="copy" x="465" y="198">One model, two backends</text>
    <rect x="470" y="231" width="260" height="48" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text class="label" x="600" y="261" text-anchor="middle">Bitmap · reference semantics</text>
    <path d="M600 283v25" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="470" y="319" width="260" height="48" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text class="label" x="600" y="349" text-anchor="middle">Precompiled · production path</text>

    <rect class="card" x="825" y="120" width="330" height="250" rx="18"/>
    <rect x="825" y="120" width="330" height="8" rx="4" fill="#b45309"/>
    <text class="heading" x="855" y="169">3 · Check</text>
    <text class="copy" x="855" y="198">Evidence at different layers</text>
    <circle cx="878" cy="242" r="9" fill="#4f46e5"/>
    <text class="label" x="902" y="248">208 spec requirements</text>
    <circle cx="878" cy="292" r="9" fill="#0f766e"/>
    <text class="label" x="902" y="298">Structural + SMT properties</text>
    <circle cx="878" cy="342" r="9" fill="#b45309"/>
    <text class="label" x="902" y="348">Lean refinement proofs</text>
  </g>

  <path d="M379 245h42M769 245h42" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="heading" x="600" y="433" text-anchor="middle">Model the coordination. Run the work. Check the seam between them.</text>
  <text class="copy" x="600" y="468" text-anchor="middle">Concurrency and timing stay visible instead of disappearing into control flow.</text>
</svg>
