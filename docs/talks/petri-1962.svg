<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="rxTeal" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#0b1220"/>
  <rect x="14" y="14" width="1172" height="652" rx="20" fill="none" stroke="#1b2840" stroke-width="1.5"/>

  <!-- citation card -->
  <rect x="290" y="92" width="620" height="150" rx="16" fill="#0f1c30" stroke="#46566e" stroke-width="1.5"/>
  <text x="600" y="150" text-anchor="middle" font-size="26" font-style="italic" fill="#e8eef6">"Kommunikation mit Automaten"</text>
  <text x="600" y="186" text-anchor="middle" font-size="19" fill="#aebccd">Carl Adam Petri &#183; PhD &#183; TH Darmstadt</text>
  <text x="600" y="220" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="4" fill="#fbbf24">1962</text>

  <!-- the kind of thing he drew: a reaction as a net -->
  <text x="600" y="306" text-anchor="middle" font-size="16" fill="#8295ab">the kind of thing he drew:</text>

  <circle cx="430" cy="372" r="26" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <circle cx="430" cy="372" r="10" fill="#38bdf8"/>
  <text x="388" y="377" text-anchor="end" font-size="16" fill="#8295ab">H&#8322;</text>

  <circle cx="430" cy="462" r="26" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <circle cx="430" cy="462" r="10" fill="#38bdf8"/>
  <text x="388" y="467" text-anchor="end" font-size="16" fill="#8295ab">O&#8322;</text>

  <path d="M456,380 C512,394 522,402 548,410" stroke="#2dd4bf" stroke-width="2.2" fill="none" marker-end="url(#rxTeal)"/>
  <path d="M456,454 C512,440 522,432 548,424" stroke="#2dd4bf" stroke-width="2.2" fill="none" marker-end="url(#rxTeal)"/>

  <rect x="550" y="390" width="120" height="54" rx="9" fill="#16263c" stroke="#2dd4bf" stroke-width="2"/>
  <text x="610" y="423" text-anchor="middle" font-size="18" fill="#e8eef6">react</text>

  <path d="M672,417 L758,417" stroke="#2dd4bf" stroke-width="2.2" fill="none" marker-end="url(#rxTeal)"/>

  <circle cx="790" cy="417" r="26" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <circle cx="790" cy="417" r="10" fill="#2dd4bf"/>
  <text x="832" y="422" text-anchor="start" font-size="16" fill="#8295ab">H&#8322;O</text>

  <text x="600" y="514" text-anchor="middle" font-size="15.6" fill="#8aa0b8">two things, combined in a single step</text>

  <!-- callout -->
  <rect x="70" y="556" width="1060" height="92" rx="14" fill="#0d1c2a" stroke="#15463f" stroke-width="1.5"/>
  <text x="600" y="592" text-anchor="middle" font-size="18.6" fill="#bac8d7">Chemistry, not sequence.</text>
  <text x="600" y="624" text-anchor="middle" font-size="18.6" font-weight="700" fill="#2dd4bf">Two inputs that combine in a single, indivisible firing.</text>
</svg>
