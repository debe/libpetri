<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="cTeal" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="cMute" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#44546b"/>
    </marker>
    <marker id="cRet" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3f8b80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#0b1220"/>
  <rect x="14" y="14" width="1172" height="652" rx="20" fill="none" stroke="#1b2840" stroke-width="1.5"/>

  <!-- ===== PERMIT place (one token = the lock) ===== -->
  <circle cx="600" cy="106" r="31" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <circle cx="600" cy="106" r="12" fill="#38bdf8"/>
  <text x="600" y="58" text-anchor="middle" font-size="16.8" font-weight="600" fill="#cdd9e6">PERMIT</text>
  <text x="654" y="110" font-size="14.4" fill="#8295ab">one token</text>

  <!-- contended consumption arcs (teal): both acquires need the one permit -->
  <path d="M576,124 C476,156 432,178 386,196" stroke="#2dd4bf" stroke-width="2.2" fill="none" marker-end="url(#cTeal)"/>
  <path d="M624,124 C724,156 768,178 814,196" stroke="#2dd4bf" stroke-width="2.2" fill="none" marker-end="url(#cTeal)"/>
  <text x="600" y="170" text-anchor="middle" font-size="15.0" fill="#8aa0b8">both acquire transitions need it</text>

  <!-- acquire transitions (in conflict) -->
  <rect x="306" y="198" width="108" height="52" rx="9" fill="#16263c" stroke="#2dd4bf" stroke-width="2"/>
  <text x="360" y="230" text-anchor="middle" font-size="18.0" fill="#e8eef6">acquire A</text>
  <rect x="786" y="198" width="108" height="52" rx="9" fill="#16263c" stroke="#2dd4bf" stroke-width="2"/>
  <text x="840" y="230" text-anchor="middle" font-size="18.0" fill="#e8eef6">acquire B</text>

  <!-- acquire -> section -->
  <path d="M360,250 L360,324" stroke="#44546b" stroke-width="2" fill="none" marker-end="url(#cMute)"/>
  <path d="M840,250 L840,324" stroke="#44546b" stroke-width="2" fill="none" marker-end="url(#cMute)"/>

  <!-- critical-section places (mutually exclusive) -->
  <circle cx="360" cy="354" r="28" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <text x="318" y="358" text-anchor="end" font-size="15.0" fill="#8295ab">A in section</text>
  <circle cx="840" cy="354" r="28" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <text x="882" y="358" text-anchor="start" font-size="15.0" fill="#8295ab">B in section</text>
  <text x="600" y="350" text-anchor="middle" font-size="15.0" font-weight="600" fill="#f5556d">never both at once</text>

  <!-- section -> release -->
  <path d="M360,382 L360,442" stroke="#44546b" stroke-width="2" fill="none" marker-end="url(#cMute)"/>
  <path d="M840,382 L840,442" stroke="#44546b" stroke-width="2" fill="none" marker-end="url(#cMute)"/>

  <!-- release transitions -->
  <rect x="306" y="444" width="108" height="52" rx="9" fill="#16263c" stroke="#5b6e88" stroke-width="2"/>
  <text x="360" y="476" text-anchor="middle" font-size="18.0" fill="#dbe5f0">release A</text>
  <rect x="786" y="444" width="108" height="52" rx="9" fill="#16263c" stroke="#5b6e88" stroke-width="2"/>
  <text x="840" y="476" text-anchor="middle" font-size="18.0" fill="#dbe5f0">release B</text>

  <!-- release -> PERMIT (the permit returns: complete, cycling causality) -->
  <path d="M322,452 C150,392 178,150 572,112" stroke="#3f8b80" stroke-width="2.2" fill="none" marker-end="url(#cRet)"/>
  <path d="M878,452 C1050,392 1022,150 628,112" stroke="#3f8b80" stroke-width="2.2" fill="none" marker-end="url(#cRet)"/>
  <text x="138" y="300" text-anchor="middle" font-size="14.4" fill="#5f9a91" transform="rotate(-90 138 300)">releasing returns the permit</text>
  <text x="1062" y="300" text-anchor="middle" font-size="14.4" fill="#5f9a91" transform="rotate(90 1062 300)">releasing returns the permit</text>

  <!-- ===== bottom callout ===== -->
  <rect x="70" y="582" width="1060" height="84" rx="14" fill="#0d1c2a" stroke="#15463f" stroke-width="1.5"/>
  <text x="600" y="614" text-anchor="middle" font-size="18.6" font-weight="700" fill="#2dd4bf">Firing one acquire consumes the permit. The other is disabled, the same instant.</text>
  <text x="600" y="640" text-anchor="middle" font-size="16.2" fill="#bac8d7">The permit token is the lock. PERMIT holds one, so the two tasks never run at once.</text>
</svg>
