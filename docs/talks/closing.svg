<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="cqTeal" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="540" fill="#0b1220"/>
  <rect x="14" y="14" width="1172" height="512" rx="20" fill="none" stroke="#1b2840" stroke-width="1.5"/>

  <text x="600" y="108" text-anchor="middle" font-size="40" font-weight="700" fill="#e8eef6">Thank you</text>

  <!-- petri flow: question -> discussion -> answer -->
  <circle cx="340" cy="280" r="44" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <text x="340" y="296" text-anchor="middle" font-size="38" font-weight="700" fill="#2dd4bf">?</text>
  <text x="340" y="352" text-anchor="middle" font-size="15.6" fill="#8295ab">a question</text>

  <path d="M388,280 L509,280" stroke="#2dd4bf" stroke-width="2.4" fill="none" marker-end="url(#cqTeal)"/>

  <rect x="515" y="247" width="170" height="66" rx="10" fill="#16263c" stroke="#2dd4bf" stroke-width="2"/>
  <text x="600" y="287" text-anchor="middle" font-size="21" fill="#e8eef6">Discussion</text>

  <path d="M691,280 L812,280" stroke="#2dd4bf" stroke-width="2.4" fill="none" marker-end="url(#cqTeal)"/>

  <circle cx="860" cy="280" r="44" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <text x="860" y="296" text-anchor="middle" font-size="38" font-weight="700" fill="#fbbf24">!</text>
  <text x="860" y="352" text-anchor="middle" font-size="15.6" fill="#8295ab">an answer</text>

  <text x="600" y="448" text-anchor="middle" font-size="30" font-weight="700" fill="#2dd4bf">Causality, not order.</text>
  <text x="600" y="488" text-anchor="middle" font-size="16" fill="#5b6e88">github.com/debe/libpetri</text>
</svg>
