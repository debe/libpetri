<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f5556d"/>
    </marker>
    <marker id="arrMute" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#44546b"/>
    </marker>
    <marker id="arrTeal" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="680" fill="#0b1220"/>
  <rect x="14" y="14" width="1172" height="652" rx="20" fill="none" stroke="#1b2840" stroke-width="1.5"/>

  <!-- divider -->
  <line x1="600" y1="70" x2="600" y2="582" stroke="#1b2840" stroke-width="1.5"/>

  <!-- ================= LEFT: STATE MACHINE (red) ================= -->
  <text x="300" y="62" text-anchor="middle" font-size="24.0" font-weight="700" letter-spacing="2" fill="#f5556d">STATE MACHINE</text>
  <text x="300" y="88" text-anchor="middle" font-size="16.8" fill="#8295ab">one state at a time</text>

  <!-- explosion tree edges -->
  <g stroke="#f5556d" stroke-width="1.6" fill="none" opacity="0.5">
    <path d="M110,300 L188,232" marker-end="url(#arrRed)"/>
    <path d="M110,300 L188,368" marker-end="url(#arrRed)"/>
    <path d="M212,228 L296,184"/>
    <path d="M212,228 L296,252"/>
    <path d="M212,372 L296,348"/>
    <path d="M212,372 L296,416"/>
    <path d="M315,182 L402,142"/>
    <path d="M315,182 L402,188"/>
    <path d="M315,252 L402,234"/>
    <path d="M315,252 L402,280"/>
    <path d="M315,348 L402,326"/>
    <path d="M315,348 L402,372"/>
    <path d="M315,416 L402,418"/>
    <path d="M315,416 L402,462"/>
  </g>
  <!-- tangle cross-links among the leaf states -->
  <g stroke="#f5556d" stroke-width="1" fill="none" opacity="0.22">
    <path d="M412,142 L412,234"/>
    <path d="M412,188 L412,326"/>
    <path d="M412,280 L412,418"/>
    <path d="M412,234 L412,372"/>
    <path d="M412,326 L412,462"/>
  </g>

  <!-- root state -->
  <circle cx="95" cy="300" r="16" fill="#2a1018" stroke="#f5556d" stroke-width="2"/>
  <!-- level 1 -->
  <circle cx="200" cy="228" r="13" fill="#2a1018" stroke="#f5556d" stroke-width="1.8"/>
  <circle cx="200" cy="372" r="13" fill="#2a1018" stroke="#f5556d" stroke-width="1.8"/>
  <!-- level 2 -->
  <circle cx="305" cy="182" r="10" fill="#2a1018" stroke="#f5556d" stroke-width="1.6"/>
  <circle cx="305" cy="252" r="10" fill="#2a1018" stroke="#f5556d" stroke-width="1.6"/>
  <circle cx="305" cy="348" r="10" fill="#2a1018" stroke="#f5556d" stroke-width="1.6"/>
  <circle cx="305" cy="416" r="10" fill="#2a1018" stroke="#f5556d" stroke-width="1.6"/>
  <!-- level 3 (leaves) -->
  <g fill="#2a1018" stroke="#f5556d" stroke-width="1.4">
    <circle cx="412" cy="142" r="7"/>
    <circle cx="412" cy="188" r="7"/>
    <circle cx="412" cy="234" r="7"/>
    <circle cx="412" cy="280" r="7"/>
    <circle cx="412" cy="326" r="7"/>
    <circle cx="412" cy="372" r="7"/>
    <circle cx="412" cy="418" r="7"/>
    <circle cx="412" cy="462" r="7"/>
  </g>
  <text x="470" y="298" font-size="18.0" font-weight="700" fill="#f5556d">. . .</text>
  <text x="500" y="304" font-size="18.0" fill="#c98a96">2&#8311; = 128</text>

  <!-- multiplication ladder -->
  <text x="300" y="520" text-anchor="middle" font-size="17.4" fill="#f5556d">1 &#8594; 2 &#8594; 4 &#8594; 8 &#8594; 16 &#8594; 32 &#8594; 64 &#8594; 128</text>
  <text x="300" y="548" text-anchor="middle" font-size="15.6" fill="#8295ab">7 parallel paths. The diagram stops explaining anything.</text>

  <!-- ================= RIGHT: PETRI NET (teal) ================= -->
  <text x="900" y="62" text-anchor="middle" font-size="24.0" font-weight="700" letter-spacing="2" fill="#2dd4bf">PETRI NET</text>
  <text x="900" y="88" text-anchor="middle" font-size="16.8" fill="#8295ab">the marking is the state</text>

  <!-- three concurrent places, each holding a token (one marking) -->
  <!-- arcs to the join -->
  <g stroke="#44546b" stroke-width="2" fill="none">
    <path d="M752,200 C820,200 838,288 866,296" marker-end="url(#arrMute)"/>
    <path d="M752,300 L866,300" marker-end="url(#arrMute)"/>
    <path d="M752,400 C820,400 838,312 866,304" marker-end="url(#arrMute)"/>
  </g>
  <!-- join -> reply -->
  <path d="M962,300 L1024,300" stroke="#2dd4bf" stroke-width="2.2" fill="none" marker-end="url(#arrTeal)"/>

  <circle cx="720" cy="200" r="26" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <circle cx="720" cy="200" r="11" fill="#38bdf8"/>
  <text x="720" y="160" text-anchor="middle" font-size="15.0" fill="#8295ab">guard ok</text>

  <circle cx="720" cy="300" r="26" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <circle cx="720" cy="300" r="11" fill="#fbbf24"/>
  <text x="668" y="305" text-anchor="end" font-size="15.0" fill="#8295ab">intent</text>

  <circle cx="720" cy="400" r="26" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <circle cx="720" cy="400" r="11" fill="#38bdf8"/>
  <text x="720" y="444" text-anchor="middle" font-size="15.0" fill="#8295ab">facets</text>

  <!-- join transition -->
  <rect x="868" y="270" width="94" height="60" rx="9" fill="#16263c" stroke="#2dd4bf" stroke-width="2"/>
  <text x="915" y="298" text-anchor="middle" font-size="18.6" font-weight="600" fill="#e8eef6">compose</text>
  <text x="915" y="318" text-anchor="middle" font-size="13.8" fill="#2dd4bf">all present</text>

  <!-- reply place -->
  <circle cx="1052" cy="300" r="26" fill="#122033" stroke="#3b4a61" stroke-width="2"/>
  <text x="1052" y="344" text-anchor="middle" font-size="15.0" fill="#8295ab">reply</text>

  <text x="900" y="520" text-anchor="middle" font-size="17.4" fill="#2dd4bf">3 tokens, 3 places, all at once</text>
  <text x="900" y="548" text-anchor="middle" font-size="15.6" fill="#8295ab">No fork operator. No 2&#8319;. Nothing hidden on the side.</text>

  <!-- ================= bottom callout ================= -->
  <rect x="70" y="598" width="1060" height="60" rx="14" fill="#0d1c2a" stroke="#233650" stroke-width="1.5"/>
  <text x="600" y="624" text-anchor="middle" font-size="18.0" font-weight="700" fill="#e8eef6">Same concurrency. Two models.</text>
  <text x="600" y="646" text-anchor="middle" font-size="16.2" fill="#bac8d7">One multiplies states until the whiteboard gives up. The other just adds tokens, and the marking holds all of it.</text>
</svg>
