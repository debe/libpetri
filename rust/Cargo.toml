[workspace]
resolver = "2"
members = [
    "libpetri-core",
    "libpetri-event",
    "libpetri-runtime",
    "libpetri-export",
    "libpetri-verification",
    "libpetri-debug",
    "libpetri-docgen",
    "libpetri",
    "libpetri-py",
    "benches",
]

[workspace.package]
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/debe/libpetri"
homepage = "https://libpetri.org"

[workspace.dependencies]
libpetri-core = { path = "libpetri-core", version = "4.0.0" }
libpetri-event = { path = "libpetri-event", version = "4.0.0" }
libpetri-runtime = { path = "libpetri-runtime", version = "4.0.0" }
libpetri-export = { path = "libpetri-export", version = "4.0.0" }
libpetri-verification = { path = "libpetri-verification", version = "4.0.0" }
libpetri-debug = { path = "libpetri-debug", version = "4.0.0" }
libpetri-docgen = { path = "libpetri-docgen", version = "4.0.0" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
criterion = { version = "0.8", features = ["html_reports"] }
pyo3 = { version = "0.28", default-features = false }
pyo3-async-runtimes = { version = "0.28", default-features = false, features = ["tokio-runtime"] }

# LTO + single codegen-unit are workspace-wide because `lto` is not allowed in
# per-package profile overrides (cargo enforces this). The Python wheel is the
# primary motivation; other release builds pay the same cost but it only hits
# `cargo build --release` / `cargo bench`, not the default debug-mode CI gates.
[profile.release]
lto = "fat"
codegen-units = 1
