  #main { padding: 0; position: relative; }

  svg { display: block; width: 100%; }
  svg text { font-size: 11px; pointer-events: none; }
  svg .node { cursor: pointer; }
  svg .edge { stroke: #999; stroke-opacity: .55; fill: none; }

  svg .dim { opacity: .2; }
