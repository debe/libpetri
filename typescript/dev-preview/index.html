<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>libpetri dev-preview</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 8px 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; gap: 12px; align-items: center; }
    header h1 { font-size: 14px; margin: 0; opacity: 0.7; font-weight: 500; }
    header .meta { font-size: 12px; opacity: 0.5; font-family: ui-monospace, monospace; }
    main { flex: 1; min-height: 0; padding: 16px; }
    #diagram-container {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    #diagram-container svg { cursor: grab; }
    #diagram-container svg:active { cursor: grabbing; }
    #status { padding: 6px 12px; background: #1e293b; border-top: 1px solid #334155; font-size: 12px; font-family: ui-monospace, monospace; }
    #status.error { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <h1>libpetri dev-preview</h1>
    <span class="meta" id="source-label">/sample.dot</span>
  </header>
  <main>
    <div id="diagram-container"></div>
  </main>
  <div id="status">loading…</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
