# Fidelity pin manifest — the Lean ↔ Rust bridge.
#
# One [[pin]] per shipped Rust item the Lean development models. The checker
# (scripts/lean-fidelity-check.py) hashes each item's current source span and
# compares it against lean/fidelity.lock; any change to a pinned item — code
# or comment — fails until the Lean model is re-verified and the lock is
# regenerated with `python3 scripts/lean-fidelity-check.py --update`.
#
# Fields:
#   file — repo-relative Rust source path
#   fn   — item name: a function, or an enum/struct where the type itself is
#          what is modeled (type pins also hash the item's impl blocks)
#   lean — the Lean modules that model the item (documentation only; the
#          checker does not parse them beyond citation scanning)
#
# Hand-maintained: add a pin when a Lean doc comment starts citing a new Rust
# item, remove it when the citation goes away. RetrodictExec.lean's pre-fix
# citations (commit 1bdf586) are historical and deliberately have no pins of
# their own — they are listed under the current items they diverge from.

