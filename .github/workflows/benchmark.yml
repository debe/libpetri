name: JMH Benchmarks

on:
  schedule:
    - cron: '0 0 * * 0'   # Weekly, Sunday midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # `mvnw verify` below runs the full suite, including the Z3BinaryGateTest
      # gate — without the solver this workflow fails where CI passes.
      - uses: ./.github/actions/install-z3

      - name: Run tests
        working-directory: java
        run: ./mvnw verify

      - name: Run JMH benchmarks
        working-directory: java
        run: ./mvnw test-compile exec:exec -Pjmh

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results
          path: java/benchmark-results.json
          retention-days: 90
