name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25-ea'
          distribution: 'temurin'
      # The pinned z3 executable every verifier shells out to (VER-013);
      # Z3BinaryGateTest fails the build if it does not resolve on this runner.
      - uses: ./.github/actions/install-z3
      - run: ./mvnw verify

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The pinned z3 executable every verifier shells out to (VER-013).
      - uses: ./.github/actions/install-z3
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test

  # The debug UI is a consumer of the TypeScript package (`file:../typescript`), and nothing
  # else compiles it: a core API change that breaks it is invisible to the typescript job. It
  # did not build for seven weeks after input guards were removed. Type-check and unit tests
  # only; the Playwright layout suite (debug-ui/e2e) stays a local tool.
  debug-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # tests/*-verification.test.ts prove the UI's own net with the z3 executable (VER-013).
      - uses: ./.github/actions/install-z3
      # debug-ui resolves `libpetri` to typescript/dist, so the package is built first.
      - name: Build the libpetri package the UI links against
        working-directory: typescript
        run: |
          npm ci
          npm run build
      - run: npm ci
        working-directory: debug-ui
      - run: npx tsc --noEmit
        working-directory: debug-ui
      - run: npm test
        working-directory: debug-ui

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        rust: [stable, "1.88"]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The verification crate shells out to the z3 executable (VER-013);
      # without it the z3-gated tests (certificate check, verdict parity) skip,
      # and tests/z3_gate.rs turns that skip into a red build here.
      - uses: ./.github/actions/install-z3
      # libpetri-py is a Python extension cdylib; building it without maturin
      # picks up the wrong python linker. Build/test the rest of the workspace
      # here; the dedicated `python` job builds the wheel via maturin.
      - run: cargo build --workspace --exclude libpetri-py --all-features
      - run: cargo test --workspace --exclude libpetri-py --all-features
      # DEFAULT features too, and not as a formality. The `z3` feature gates whole
      # modules and swaps in fallback arms, so an --all-features build never
      # compiles the code a consumer taking the crate off crates.io compiles. A
      # field added to a shared struct once broke that arm alone and shipped green
      # through every gate above, because none of them builds it.
      - run: cargo check --workspace --exclude libpetri-py
      # Compile-check the PyO3 binding too. The steps above exclude libpetri-py
      # (it needs maturin's python-extension linkage to *build*), so a binding-only
      # compile error would otherwise slip through to `maturin develop` / the python
      # job. `cargo check` type-checks without the final cdylib link, so no python
      # linker is needed; `extension-module` matches how maturin compiles it. Gated
      # to stable so the 1.88 MSRV matrix entry is unaffected by PyO3's own MSRV.
      - if: matrix.rust == 'stable'
        run: cargo check -p libpetri-py --features extension-module

  python:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Same pinned solver as the rust job; tests/test_z3_gate.py polices it.
      - uses: ./.github/actions/install-z3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install maturin pytest pytest-asyncio
      - run: maturin build --release --locked --out dist --compatibility pypi
      - run: maturin sdist --out dist
      - run: python -m pip install dist/libpetri-*.whl
      - run: pytest

  # Machine-checked soundness (lean/): the verifier's untimed abstraction and
  # the precompiled executor's hot loop (flat-pool token conservation + the
  # Bitmap/Precompiled backend refinement).
  # Proof-only: no implementation code depends on this, so the job stands alone.
  # Libpetri/Novel/ imports Mathlib; only the cached oleans of the imported
  # closure are fetched (step below), so nothing from Mathlib is compiled.
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Mathlib is never built here, and never fetched whole: the script
      # shallow-clones the manifest packages and pulls only the cached oleans
      # of the Mathlib modules lean/ imports (~80 MB compressed, not ~6.4 GB).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ runner.os }}-${{ hashFiles('lean/lake-manifest.json') }}
      - name: Fetch Lean dependencies (imported Mathlib closure only)
        run: bash ../scripts/lean-ci-deps.sh
      - run: lake build
      # A `sorry` still builds (with a warning), so the build alone is not a
      # gate. Both checks below are: grep catches the source text, and
      # `#print axioms` catches anything that reached a theorem by any route
      # (sorryAx shows up there even if the text is generated).
      - name: No sorry / admit in source
        run: '! grep -rnE "\bsorry\b|\badmit\b" Libpetri Libpetri.lean'
      # GitHub's implicit shell for a `run:` block is `bash -e {0}` — no
      # pipefail — so piping `lake env lean` into anything would mask its exit
      # status. `shell: bash` is `bash --noprofile --norc -eo pipefail {0}`, and
      # the redirect below avoids the pipe entirely; belt and braces, because a
      # green step that never ran is the exact failure this gate exists to stop.
      - name: Headline theorems depend on no unexpected axioms
        shell: bash
        run: |
          cat > /tmp/axioms.lean <<'EOF'
          import Libpetri
          import Libpetri.Reference
          #print axioms Libpetri.proposition_one
          #print axioms Libpetri.guard_hypothesis_is_necessary
          #print axioms Libpetri.unit_output_hypothesis_is_necessary
          #print axioms Libpetri.willFire_guard_is_necessary
          #print axioms Libpetri.false_proven_without_injection
          #print axioms Libpetri.injection_reaches_violation
          #print axioms Libpetri.token_conservation
          #print axioms Libpetri.consume_faithful
          #print axioms Libpetri.Pool.removeMatching_some
          #print axioms Libpetri.Pool.addLast_proj_self
          #print axioms Libpetri.fireConsume_dirty_sound
          #print axioms Libpetri.updateEnablement_sync
