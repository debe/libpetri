name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '25-ea'
          distribution: 'temurin'
      # Natives for the com.microsoft.z3 JNI bindings; see the action for why.
      # Shared with .github/workflows/benchmark.yml, which also runs `mvnw verify`.
      - uses: ./.github/actions/z3-jni-natives
      # The pinned z3 executable every verifier shells out to (VER-013).
      - uses: ./.github/actions/install-z3
      - run: ./mvnw verify

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The pinned z3 executable every verifier shells out to (VER-013).
      - uses: ./.github/actions/install-z3
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        rust: [stable, "1.88"]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The verification crate shells out to the z3 executable (VER-013);
      # without it the z3-gated tests (certificate check, verdict parity) skip,
      # and tests/z3_gate.rs turns that skip into a red build here.
      - uses: ./.github/actions/install-z3
      # libpetri-py is a Python extension cdylib; building it without maturin
      # picks up the wrong python linker. Build/test the rest of the workspace
      # here; the dedicated `python` job builds the wheel via maturin.
      - run: cargo build --workspace --exclude libpetri-py --all-features
      - run: cargo test --workspace --exclude libpetri-py --all-features
      # The TIME-013 reap witness is `#[ignore]`d (real clock + thread::sleep,
      # ~2.5s) and nothing else runs `--ignored`, so without this step the
      # allowlist in the timed differential property has no executed check
      # against the real executor at all. Stable only — it is a semantics
      # witness, not an MSRV concern.
      - if: matrix.rust == 'stable'
        name: TIME-013 reap-asymmetry witness (ignored by default)
        shell: bash
        run: |
          # `cargo test` exits 0 when a filter matches nothing, so assert the
          # witness actually ran — a rename must fail here, not pass silently.
          out=$(cargo test -p libpetri-runtime --all-features \
                  differential_prop_tests::time013_reap_asymmetry_witness \
                  -- --ignored --exact --nocapture 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          grep -q "test result: ok. 1 passed" <<< "$out" || {
            echo "the TIME-013 witness did not run — renamed, moved, or re-gated"
            exit 1
          }
      # Compile-check the PyO3 binding too. The steps above exclude libpetri-py
      # (it needs maturin's python-extension linkage to *build*), so a binding-only
      # compile error would otherwise slip through to `maturin develop` / the python
      # job. `cargo check` type-checks without the final cdylib link, so no python
      # linker is needed; `extension-module` matches how maturin compiles it. Gated
      # to stable so the 1.88 MSRV matrix entry is unaffected by PyO3's own MSRV.
      - if: matrix.rust == 'stable'
        run: cargo check -p libpetri-py --features extension-module

  python:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Same pinned solver as the rust job; tests/test_z3_gate.py polices it.
      - uses: ./.github/actions/install-z3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install maturin pytest pytest-asyncio
      - run: maturin build --release --locked --out dist --compatibility pypi
      - run: maturin sdist --out dist
      - run: python -m pip install dist/libpetri-*.whl
      - run: pytest

  # Machine-checked soundness (lean/): the verifier's untimed abstraction and
  # the precompiled executor's hot loop (flat-pool token conservation + the
  # Bitmap/Precompiled backend refinement).
  # Proof-only: no implementation code depends on this, so the job stands alone.
  # Dependency-free (no Mathlib), so the build is seconds and needs no release
  # cache — only elan itself is cached.
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake build
      # A `sorry` still builds (with a warning), so the build alone is not a
      # gate. Both checks below are: grep catches the source text, and
      # `#print axioms` catches anything that reached a theorem by any route
      # (sorryAx shows up there even if the text is generated).
      - name: No sorry / admit in source
        run: '! grep -rnE "\bsorry\b|\badmit\b" Libpetri Libpetri.lean'
      # GitHub's implicit shell for a `run:` block is `bash -e {0}` — no
      # pipefail — so piping `lake env lean` into anything would mask its exit
      # status. `shell: bash` is `bash --noprofile --norc -eo pipefail {0}`, and
      # the redirect below avoids the pipe entirely; belt and braces, because a
      # green step that never ran is the exact failure this gate exists to stop.
      - name: Headline theorems depend on no unexpected axioms
        shell: bash
        run: |
          cat > /tmp/axioms.lean <<'EOF'
          import Libpetri
          #print axioms Libpetri.proposition_one
          #print axioms Libpetri.guard_hypothesis_is_necessary
          #print axioms Libpetri.unit_output_hypothesis_is_necessary
          #print axioms Libpetri.willFire_guard_is_necessary
          #print axioms Libpetri.false_proven_without_injection
          #print axioms Libpetri.injection_reaches_violation
          #print axioms Libpetri.token_conservation
          #print axioms Libpetri.consume_faithful
          #print axioms Libpetri.Pool.removeMatching_some
          #print axioms Libpetri.Pool.addLast_proj_self
          #print axioms Libpetri.fireConsume_dirty_sound
          #print axioms Libpetri.updateEnablement_sync
          #print axioms Libpetri.precompiled_refines_bitmap_immediate
          #print axioms Libpetri.collect_ready_general_refines
          #print axioms Libpetri.tid_order_diverges
          #print axioms Libpetri.read_reset_order_diverges
          #print axioms Libpetri.canEnable_insufficient_for_totality
          #print axioms Libpetri.unknown_place_drop
          #print axioms Libpetri.deadline_reap_dirty_diverges
          #print axioms Libpetri.bb_never_fires_after_reap
          #print axioms Libpetri.pb_update_reenables
          #print axioms Libpetri.invariant_strengthening_sound
          #print axioms Libpetri.strengthened_reach_eq
          #print axioms Libpetri.strengthened_reach_eq_inj
          #print axioms Libpetri.injection_hypothesis_is_necessary
          #print axioms Libpetri.consume_all_hypothesis_is_necessary
          #print axioms Libpetri.bad_rule_nonvacuity
          #print axioms Libpetri.match_cache_lockstep
          #print axioms Libpetri.fire_muts_lockstep
          #print axioms Libpetri.sync_seed
          #print axioms Libpetri.one_exactly_is_necessary
          #print axioms Libpetri.sole_consumer_is_necessary
          #print axioms Libpetri.no_reset_is_necessary
          #print axioms Libpetri.wJoinOne_is_fast_path
          #print axioms Libpetri.reap_dirty_is_the_asymmetry
          #print axioms Libpetri.no_reap_frame
          #print axioms Libpetri.bad_rule_proves_every_net
          #print axioms Libpetri.invariant_strengthening_sound_inj
          #print axioms Libpetri.semiflow_union_sound
          #print axioms Libpetri.semiflow_union_sound_inj
          #print axioms Libpetri.semiflow_gate_is_necessary
          #print axioms Libpetri.vacuous_colour_layer
          #print axioms Libpetri.vacuous_colour_layer_inj
          #print axioms Libpetri.Explorer.interned_keys_eq
          #print axioms Libpetri.Explorer.interned_edges_eq
          #print axioms Libpetri.equivariance_is_necessary
          EOF
          if ! lake env lean /tmp/axioms.lean > /tmp/axioms.out 2>&1; then
            cat /tmp/axioms.out
            echo "axiom check: lake env lean failed — a listed theorem was" \
                 "renamed, moved out of the Libpetri namespace, or deleted."
            exit 1
          fi
          cat /tmp/axioms.out
          ! grep -q "sorryAx" /tmp/axioms.out
          # Every `#print axioms` must have produced a report line ('Name' ...).
          # Without this a truncated or empty output passes the grep above
          # *because* the check did not run.
          want=$(grep -c '^#print axioms' /tmp/axioms.lean)
          got=$(grep -c "^'" /tmp/axioms.out || true)
          if [ "$got" -ne "$want" ]; then
            echo "axiom check reported $got of $want theorems — the check did not run"
            exit 1
          fi
          echo "axiom check: $got theorems reported, no sorryAx"
      # The proofs cite shipped Rust functions; the pins in lean/fidelity.toml
      # hash those functions so a change to modeled code fails CI until the
      # model is consciously re-verified (workflow in lean/README.md).
      - name: Lean fidelity pins match cited Rust source
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lean-fidelity-check.py
      # spec/coverage-matrix.md is generated; keep it in lockstep with the
      # spec index, lean/proof-coverage.json, and the test suites.
      - name: Spec coverage matrix is up to date
        working-directory: ${{ github.workspace }}
        run: python3 scripts/spec-coverage-matrix.py --check

  # Guards the doc-generator viewer bundle (petrinet-diagrams.js): the baked
  # Graphviz-WASM must instantiate + render, and the committed assets must be
  # the reproducible output of the locked toolchain (no silent dep drift).
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the viewer IIFE, validates the embedded WASM (check-viewer-wasm),
      # and distributes the byte-identical bundle to all three resource dirs.
      - run: bash ../scripts/build-viewer.sh
      # Headless render in a real WASM engine: asserts an <svg> actually appears.
      - run: npm run smoke:viewer
      # Anti-drift: the just-rebuilt assets must match what is committed. Fails
      # if a @viz-js/viz / esbuild bump was merged without rebuilding the bundle.
      - name: No viewer-asset drift (committed == rebuilt from locked deps)
        run: |
          git -C .. diff --exit-code -- \
            java/src/main/resources/javadoc/petrinet-diagrams.js \
            java/src/main/resources/javadoc/petrinet-diagrams.css \
            rust/libpetri-docgen/resources/petrinet-diagrams.js \
            rust/libpetri-docgen/resources/petrinet-diagrams.css \
            typescript/src/doclet/resources/petrinet-diagrams.js \
            typescript/src/doclet/resources/petrinet-diagrams.css
