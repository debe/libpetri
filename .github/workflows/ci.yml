          #print axioms Libpetri.Spec.clashNu_mintOneFresh
          #print axioms Libpetri.Spec.clashNu_prefix
          #print axioms Libpetri.Spec.clashNu_budgetCount
          #print axioms Libpetri.Spec.clashNu_freeChoice
          #print axioms Libpetri.Spec.clashNu_countRest
          #print axioms Libpetri.Spec.clashNu_demand
          #print axioms Libpetri.Spec.Verifier.firstDecided_sound
          #print axioms Libpetri.Spec.Verifier.refSteps_sound
          #print axioms Libpetri.Spec.Verifier.enumPhase_sound
          #print axioms Libpetri.Spec.Verifier.pipeVerify_VER_003_of
          #print axioms Libpetri.Spec.Verifier.pipeVerify_VER_003
          #print axioms Libpetri.Spec.Verifier.pipeVerify_noStop
          #print axioms Libpetri.Spec.Verifier.runPipeline_after_stop
          #print axioms Libpetri.Spec.Verifier.runPipeline_ordered
          #print axioms Libpetri.Spec.Verifier.Graph.bfs_sound
          #print axioms Libpetri.Spec.Verifier.Graph.bfs_complete
          #print axioms Libpetri.Spec.Verifier.Graph.shortest_spec
          #print axioms Libpetri.Spec.Verifier.Graph.trace_spec
          #print axioms Libpetri.Spec.Verifier.Graph.build_closed_iff
          #print axioms Libpetri.Spec.Verifier.Graph.cache_proven
          #print axioms Libpetri.Spec.Verifier.Graph.cache_violated_safety
          #print axioms Libpetri.Spec.Verifier.Graph.enum_complete_stored
          #print axioms Libpetri.Spec.Verifier.Scg.canon_unique
          #print axioms Libpetri.Spec.Verifier.Scg.classKey_eq_iff
          #print axioms Libpetri.Spec.Verifier.Scg.timed_run_stored
          #print axioms Libpetri.Spec.Verifier.Scg.timed_safety_closed
          #print axioms Libpetri.Spec.Verifier.Scg.scgE_equivariant
          #print axioms Libpetri.Spec.Verifier.Split.refSplit_error_iff
          #print axioms Libpetri.Spec.Verifier.Split.refSplit_run
          #print axioms Libpetri.Spec.Verifier.Split.fires_split
          #print axioms Libpetri.Spec.Verifier.Split.quiescent_no_inflight
          #print axioms Libpetri.Spec.Verifier.OpenNet.meets_iff_parts
          #print axioms Libpetri.Spec.Verifier.OpenNet.terminates_iff_no_lasso
          #print axioms Libpetri.Spec.Verifier.OpenNet.judge_proven_sound
          #print axioms Libpetri.Spec.Verifier.OpenNet.judge_violated_sound
          #print axioms Libpetri.Spec.Verifier.Bridges.flatCert_sound
          #print axioms Libpetri.Spec.Verifier.Bridges.FlatProgSound.progSound
          #print axioms Libpetri.Spec.Verifier.Bridges.onTime_sim
          #print axioms Libpetri.Spec.Verifier.Bridges.onTime_safety_closed
          #print axioms Libpetri.Spec.Verifier.Bridges.ref_late_sim
          #print axioms Libpetri.Spec.Verifier.Bridges.ref_rest_reapable
          #print axioms Libpetri.Spec.VER_003_joint
          #print axioms Libpetri.Spec.VER_006_verdict_joint
          #print axioms Libpetri.Spec.VER_010_joint
          #print axioms Libpetri.Spec.VER_012_joint
          #print axioms Libpetri.Spec.VER_020_guard_joint
          #print axioms Libpetri.Spec.VER_021_joint
          #print axioms Libpetri.Spec.VER_022_joint
          #print axioms Libpetri.Spec.VER_024_joint
          #print axioms Libpetri.Spec.VER_018_order_consistent
          #print axioms Libpetri.Spec.VER_013_joint
          #print axioms Libpetri.Spec.Ver013.VER_013_stop_failing
          #print axioms Libpetri.Spec.spec_consistent_all
          #print axioms Libpetri.Spec.allSpec_ref
          #print axioms Libpetri.Spec.queueSpec_ref
          #print axioms Libpetri.Spec.structureSpec_ref
          #print axioms Libpetri.Spec.composeSpec_ref
          #print axioms Libpetri.Spec.nuSpec_ref
          #print axioms Libpetri.Spec.verSpec_ref
          #print axioms Libpetri.Spec.exportSpec_ref
          #print axioms Libpetri.Spec.storeSpec_ref
          #print axioms Libpetri.Spec.passOrder_ref
          #print axioms Libpetri.Spec.VER_004_exec_of
          EOF
          if ! lake env lean /tmp/axioms.lean > /tmp/axioms.out 2>&1; then
            cat /tmp/axioms.out
            echo "axiom check: lake env lean failed — a listed theorem was" \
                 "renamed, moved out of the Libpetri namespace, or deleted."
            exit 1
          fi
          cat /tmp/axioms.out
          ! grep -q "sorryAx" /tmp/axioms.out
          # Every `#print axioms` must have produced a report line ('Name' ...).
          # Without this a truncated or empty output passes the grep above
          # *because* the check did not run.
          want=$(grep -c '^#print axioms' /tmp/axioms.lean)
          got=$(grep -c "^'" /tmp/axioms.out || true)
          if [ "$got" -ne "$want" ]; then
            echo "axiom check reported $got of $want theorems — the check did not run"
            exit 1
          fi
          echo "axiom check: $got theorems reported, no sorryAx"
      # The proofs cite shipped Rust functions; the pins in lean/fidelity.toml
      # hash those functions so a change to modeled code fails CI until the
      # model is consciously re-verified (workflow in lean/README.md).
      - name: Lean fidelity pins match cited Rust source
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest scripts/test_lean_fidelity_check.py
          python3 scripts/lean-fidelity-check.py
      # Lean prose and the spec name code items, never line numbers: a line
      # number goes stale as soon as the code above it moves.
      - name: No line-number citations in Lean or the spec
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest scripts/test_no_line_hints.py
          python3 scripts/no-line-hints.py
      # lean/report/requirements.{md,json} and lean/report/proof-coverage.json
      # are generated from the requirement blocks and their @[evidence] tags
      # (proof-coverage.json from the `cites` tags), lean/report/spec.json from
      # the spec text and the runtime ledger; regenerating them must be a no-op
      # (same pattern as the proof graph below). It runs before the coverage
      # matrix and the proof graph, which read proof-coverage.json and
      # spec.json, so they see the regenerated files. ls-files fails when a file is not
      # tracked at all (git diff is blind to untracked files); the porcelain
      # check, --ignored included, catches a generated file that was never
      # committed or that a .gitignore rule hides.
      - name: Requirements report is up to date
        shell: bash
        run: |
          lake env lean spec-tools/Report.lean
          git ls-files --error-unmatch report/requirements.md report/requirements.json \
            report/proof-coverage.json report/spec.json
          git diff --exit-code -- report/
          test -z "$(git status --porcelain --ignored -- report/)"
      # The chapters declared in Lean (`spec_chapter`, Libpetri/Spec/Text/) are the source of
      # their spec/*.md; regenerating them must be a no-op, so a hand edit to a generated file,
      # or a Lean text edit without a rerun, fails here. The porcelain check catches a chapter
      # rendered for the first time and never committed.
      - name: Generated spec markdown is up to date
        shell: bash
        run: |
          lake env lean spec-tools/Render.lean
          git diff --exit-code -- ../spec/
          test -z "$(git status --porcelain -- ../spec/)"
      # spec/coverage-matrix.md is generated; keep it in lockstep with
      # lean/report/spec.json, lean/report/proof-coverage.json, and the test suites.
      - name: Spec coverage matrix is up to date
        working-directory: ${{ github.workspace }}
        run: python3 scripts/spec-coverage-matrix.py --check
      # lean/graph/ and docs/proof-graph/ are generated from the build;
      # regenerating them must be a no-op.
      - name: Proof graph is up to date
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest scripts/test_proof_graph.py
          bash scripts/regen-proof-graph.sh
          git diff --exit-code -- lean/graph docs/proof-graph
          test -z "$(git status --porcelain -- lean/graph docs/proof-graph)"
      # The style constants of the three runtimes and the Lean node and edge
      # tables the export blocks read (lean/Libpetri/Export/Styles.lean) are
      # generated from spec/petri-net-styles.json; regenerating them must be a
      # no-op, so a hand edit to one copy or a table change without a rerun
      # fails here. jq is preinstalled on the runner.
      - name: Style tables are up to date
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/generate-styles.sh
          styles="rust/libpetri-export/src/styles.rs java/src/main/java/org/libpetri/export/StyleConstants.java typescript/src/export/styles.ts lean/Libpetri/Export/Styles.lean"
          git diff --exit-code -- $styles
          test -z "$(git status --porcelain -- $styles)"
      # The sorry/admit grep above stays; this widens it to the other ways a
      # proof can skip the kernel (sorryAx, native_decide, axiom,
      # implemented_by, skipKernelTC, addDeclCore, ...) over Libpetri/, lean/*.lean,
      # spec-tools/ and ProofGraph/, plus module-wide options in lakefile.toml.
      # The scanner's own tests run first (raw strings, interpolation).
      - name: No proof escape hatches in Lean source
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest scripts/test_lean_escape_hatch_check.py
          python3 scripts/lean-escape-hatch-check.py
      # The audit below and the requirements report only see the modules they
      # import; a cites tag in a module the report does not import would never
      # reach proof-coverage.json. Every Libpetri module must be imported
      # directly by spec-tools/Audit.lean and spec-tools/Report.lean, every
      # Libpetri.Spec module by Spec/All.lean.
      - name: Every Lean module is reached by the audit and the report
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lean-module-coverage-check.py
      # `#audit_axioms` walks every constant whose module root is Libpetri
      # (private ones included) and fails on an axiom declared under Libpetri
      # or on any axiom outside propext / Quot.sound / Classical.choice.
      # `#audit_spec` checks the requirement blocks against the spec text as
      # the generated chapters show it: every normative sentence of an ID with
      # a block is covered or assumed, the kinds agree, every block has
      # evidence, no citation names a removed requirement (SPEC <rule> lines).
      # A logged error makes `lean` exit non-zero, so no output parsing is
      # needed. The hand-listed `#print axioms` step above stays until this
      # one has been green for a while.
      - name: Standard axioms only; requirement blocks agree with the spec text
        shell: bash
        run: lake env lean spec-tools/Audit.lean
      # Runs the planted-fault cases (registry: blank reading, forbids without
      # ¬, holds assuming its requirement, nonvacuous : True, stale sign-off
      # hash, cites on another module's theorem, cites with an invisible
      # fragment; escape hatches: private axiom, native_decide, sorry outside
      # Spec, addDeclCore without the kernel check; module coverage of
      # Spec/All.lean and of Report.lean; spec audit: uncovered shall sentence,
      # covered span in an HTML comment, kind edited in a text, tombstoned
      # citation; quote in a verbatim block; stale report; hand-edited
      # proof-coverage.json; hand-edited generated spec/10-performance.md;
      # covers naming an unknown span label; Depends on a missing ID;
      # line-number citations; a type error in the spec site). Each passes only if the gate meant to catch it
      # fails with that gate's own message. Restores every planted file
      # (md5-checked).
      - name: Spec/Lean gates catch planted faults
        shell: bash
        run: bash ../scripts/test_spec_lean_gates.sh

  # Guards the doc-generator viewer bundle (petrinet-diagrams.js): the baked
  # Graphviz-WASM must instantiate + render, and the committed assets must be
  # the reproducible output of the locked toolchain (no silent dep drift).
  # Conformance against the verified Lean reference (spec/verification-fixtures/conformance/):
  # the Lean binary re-derives every expected verdict (freshness), then each language's verifier
  # runs the corpus on every route and must never contradict the reference, and every Violated
  # trace it reports is replayed by the verified firing rule. LIBPETRI_CONFORMANCE_REQUIRE=1 turns
  # a missing corpus into a failure, and an empty trace dump fails the replay step.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBPETRI_CONFORMANCE_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ runner.os }}-${{ hashFiles('lean/lake-manifest.json') }}
      - name: Fetch Lean dependencies (imported Mathlib closure only)
        working-directory: lean
        run: bash ../scripts/lean-ci-deps.sh
      - name: Build the Lean reference
        working-directory: lean
        run: lake build reference
      - uses: ./.github/actions/install-z3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-java@v6
        with:
          java-version: '25-ea'
          distribution: 'temurin'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Expected verdicts are fresh (re-derived by the Lean reference)
        run: python3 scripts/conformance-corpus.py --check
      # spec/situations/expected/ (the spec site's step replays) is re-derived the same way.
      - name: Situation replays are fresh (re-derived by the Lean reference)
        run: python3 scripts/situations.py --check
      - run: python3 scripts/conformance-replay.py --lang rust
      - run: python3 scripts/conformance-replay.py --lang java
      - name: TypeScript dependencies
        working-directory: typescript
        run: npm ci
      - run: python3 scripts/conformance-replay.py --lang ts
      - name: Python wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest pytest-asyncio
          maturin build --release --locked --out dist --compatibility pypi
          python -m pip install dist/libpetri-*.whl
      - run: python3 scripts/conformance-replay.py --lang py

  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      # `--with-deps` runs `apt-get update`, which on the runner image also hits
      # Google's chrome-stable repo. That repo intermittently serves a
      # Packages.gz whose digest does not match its Release file, and apt then
      # exits 100 and fails the job. Nothing here installs from it (Chromium
      # comes from Playwright's own CDN), so drop the source list first.
      - name: Install Chromium for the headless render smoke test
        run: |
          lists=$(grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null || true)
          if [ -n "$lists" ]; then sudo rm -f $lists; fi
          npx playwright install --with-deps chromium
      # Builds the viewer IIFE, validates the embedded WASM (check-viewer-wasm),
      # and distributes the byte-identical bundle to all three resource dirs.
      - run: bash ../scripts/build-viewer.sh
      # Headless render in a real WASM engine: asserts an <svg> actually appears.
      - run: npm run smoke:viewer
      # Anti-drift: the just-rebuilt assets must match what is committed. Fails
      # if a @viz-js/viz / esbuild bump was merged without rebuilding the bundle.
      - name: No viewer-asset drift (committed == rebuilt from locked deps)
        run: |
          git -C .. diff --exit-code -- \
            java/src/main/resources/javadoc/petrinet-diagrams.js \
            java/src/main/resources/javadoc/petrinet-diagrams.css \
            rust/libpetri-docgen/resources/petrinet-diagrams.js \
            rust/libpetri-docgen/resources/petrinet-diagrams.css \
            typescript/src/doclet/resources/petrinet-diagrams.js \
            typescript/src/doclet/resources/petrinet-diagrams.css

  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      # The skill in plugins/libpetri/skills/ is loaded by Claude Code, Codex,
      # opencode and oh-my-pi. opencode drops a skill SILENTLY when its
      # description exceeds 1024 chars or its name does not match its directory,
      # and `claude plugin validate` passes on both, so this is the only gate
      # that catches it. Also asserts .agents/skills/ is still a resolving
      # symlink: a Windows checkout without core.symlinks turns it into a text
      # file, which stops the skill loading in all three non-Claude harnesses.
      - run: python scripts/check-agent-skills.py
