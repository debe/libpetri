name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '25-ea'
          distribution: 'temurin'
      - run: ./mvnw verify

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        rust: [stable, "1.88"]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # libpetri-py is a Python extension cdylib; building it without maturin
      # picks up the wrong python linker. Build/test the rest of the workspace
      # here; the dedicated `python` job builds the wheel via maturin.
      - run: cargo build --workspace --exclude libpetri-py --all-features
      - run: cargo test --workspace --exclude libpetri-py --all-features

  python:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install z3 (for verification tests)
        run: sudo apt-get update && sudo apt-get install -y z3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install maturin pytest pytest-asyncio
      - run: maturin build --release --locked --out dist --compatibility pypi
      - run: maturin sdist --out dist
      - run: python -m pip install dist/libpetri-*.whl
      - run: pytest

  # Guards the doc-generator viewer bundle (petrinet-diagrams.js): the baked
  # Graphviz-WASM must instantiate + render, and the committed assets must be
  # the reproducible output of the locked toolchain (no silent dep drift).
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the viewer IIFE, validates the embedded WASM (check-viewer-wasm),
      # and distributes the byte-identical bundle to all three resource dirs.
      - run: bash ../scripts/build-viewer.sh
      # Headless render in a real WASM engine: asserts an <svg> actually appears.
      - run: npm run smoke:viewer
      # Anti-drift: the just-rebuilt assets must match what is committed. Fails
      # if a @viz-js/viz / esbuild bump was merged without rebuilding the bundle.
      - name: No viewer-asset drift (committed == rebuilt from locked deps)
        run: |
          git -C .. diff --exit-code -- \
            java/src/main/resources/javadoc/petrinet-diagrams.js \
            java/src/main/resources/javadoc/petrinet-diagrams.css \
            rust/libpetri-docgen/resources/petrinet-diagrams.js \
            rust/libpetri-docgen/resources/petrinet-diagrams.css \
            typescript/src/doclet/resources/petrinet-diagrams.js \
            typescript/src/doclet/resources/petrinet-diagrams.css
