name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25-ea'
          distribution: 'temurin'
      # The pinned z3 executable every verifier shells out to (VER-013);
      # Z3BinaryGateTest fails the build if it does not resolve on this runner.
      - uses: ./.github/actions/install-z3
      - run: ./mvnw verify

  typescript:
    runs-on: ubuntu-latest
    # 20: `npm test` alone takes 6-10 min, most of it the z3-backed replay of
    # the 305-net conformance corpus (tests/verification/conformance).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The pinned z3 executable every verifier shells out to (VER-013).
      - uses: ./.github/actions/install-z3
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test

  # The debug UI is a consumer of the TypeScript package (`file:../typescript`), and nothing
  # else compiles it: a core API change that breaks it is invisible to the typescript job. It
  # did not build for seven weeks after input guards were removed. Type-check and unit tests
  # only; the Playwright layout suite (debug-ui/e2e) stays a local tool.
  debug-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # tests/*-verification.test.ts prove the UI's own net with the z3 executable (VER-013).
      - uses: ./.github/actions/install-z3
      # debug-ui resolves `libpetri` to typescript/dist, so the package is built first.
      - name: Build the libpetri package the UI links against
        working-directory: typescript
        run: |
          npm ci
          npm run build
      - run: npm ci
        working-directory: debug-ui
      - run: npx tsc --noEmit
        working-directory: debug-ui
      - run: npm test
        working-directory: debug-ui

  # The public spec site (libpetri.org/spec/): spec-site/ generates docs/spec/index.html from
  # lean/report/ (spec.json: the spec as data), spec/coverage-matrix.md and spec/situations/,
  # and refreshes the counts on docs/index.html.
  spec-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # spec-site resolves `libpetri` to typescript/dist (the diagrams come from its exporter).
      - name: Build the libpetri package the site links against
        working-directory: typescript
        run: |
          npm ci
          npm run build
      - run: npm ci
        working-directory: spec-site
      - run: npm run check
        working-directory: spec-site
      - run: npm test
        working-directory: spec-site
      - run: npm run build
        working-directory: spec-site
      # The committed pages must equal a rebuild from the committed sources and Lean reports.
      - name: Spec site is up to date
        run: |
          git diff --exit-code -- docs/spec docs/index.html docs/404.html
          test -z "$(git status --porcelain -- docs/spec docs/index.html docs/404.html)"
      # Same apt workaround as the viewer job below.
      - name: Install Chromium for the browser tests
        working-directory: spec-site
        run: |
          lists=$(grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null || true)
          if [ -n "$lists" ]; then sudo rm -f $lists; fi
          npx playwright install --with-deps chromium
      # Every route, the page's own #/selftest (0 errors), axe in both themes, and screenshots
      # at desktop width and 400px into spec-site/test-results/screenshots/.
      - run: npm run e2e
        working-directory: spec-site
      - name: Upload screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spec-site-screenshots
          path: |
            spec-site/test-results/
            spec-site/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        rust: [stable, "1.88"]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The verification crate shells out to the z3 executable (VER-013);
      # without it the z3-gated tests (certificate check, verdict parity) skip,
      # and tests/z3_gate.rs turns that skip into a red build here.
      - uses: ./.github/actions/install-z3
      # libpetri-py is a Python extension cdylib; building it without maturin
      # picks up the wrong python linker. Build/test the rest of the workspace
      # here; the dedicated `python` job builds the wheel via maturin.
      - run: cargo build --workspace --exclude libpetri-py --all-features
      - run: cargo test --workspace --exclude libpetri-py --all-features
      # DEFAULT features too, and not as a formality. The `z3` feature gates whole
      # modules and swaps in fallback arms, so an --all-features build never
      # compiles the code a consumer taking the crate off crates.io compiles. A
      # field added to a shared struct once broke that arm alone and shipped green
      # through every gate above, because none of them builds it.
      - run: cargo check --workspace --exclude libpetri-py
      # Compile-check the PyO3 binding too. The steps above exclude libpetri-py
      # (it needs maturin's python-extension linkage to *build*), so a binding-only
      # compile error would otherwise slip through to `maturin develop` / the python
      # job. `cargo check` type-checks without the final cdylib link, so no python
      # linker is needed; `extension-module` matches how maturin compiles it. Gated
      # to stable so the 1.88 MSRV matrix entry is unaffected by PyO3's own MSRV.
      - if: matrix.rust == 'stable'
        run: cargo check -p libpetri-py --features extension-module

  python:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Same pinned solver as the rust job; tests/test_z3_gate.py polices it.
      - uses: ./.github/actions/install-z3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install maturin pytest pytest-asyncio
      - run: maturin build --release --locked --out dist --compatibility pypi
      - run: maturin sdist --out dist
      - run: python -m pip install dist/libpetri-*.whl
      - run: pytest

  # Machine-checked soundness (lean/): the verifier's untimed abstraction and
  # the precompiled executor's hot loop (flat-pool token conservation + the
  # Bitmap/Precompiled backend refinement).
  # Proof-only: no implementation code depends on this, so the job stands alone.
  # Libpetri/Novel/ imports Mathlib; only the cached oleans of the imported
  # closure are fetched (step below), so nothing from Mathlib is compiled.
  lean:
    runs-on: ubuntu-latest
    # 60: on a 4-vCPU runner `lake build` takes about 18 min (nothing of Libpetri is
    # cached, and the spec text adds one small module per requirement) and the
    # leanchecker kernel replay below, which re-checks every Libpetri declaration,
    # up to 14 more, on top of the report regeneration and the planted-fault gates.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Mathlib is never built here, and never fetched whole: the script
      # shallow-clones the manifest packages and pulls only the cached oleans
      # of the Mathlib modules lean/ imports (~80 MB compressed, not ~6.4 GB).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ runner.os }}-${{ hashFiles('lean/lake-manifest.json') }}
      - name: Fetch Lean dependencies (imported Mathlib closure only)
        run: bash ../scripts/lean-ci-deps.sh
      - run: lake build
      # Replays every declaration of every built Libpetri.* module through the
      # kernel, starting from the environment its imports produce. Catches
      # "environment hacking": a declaration that reached the .olean without
      # the kernel accepting it (skipKernelTC, addDeclWithoutChecking, a
      # tampered olean). `#print axioms` cannot: a planted
      # `theorem : False := True.intro` added under skipKernelTC reports "does
      # not depend on any axioms", and leanchecker rejects it with a kernel
      # type mismatch. `leanchecker` ships with the toolchain; it exits
      # non-zero on a rejected declaration or a name with no oleans.
      #
      # Not `lake env leanchecker Libpetri` in one call: that starts one task
      # per module, each with its own imported environment, and peaked at
      # 28 GB RSS (the runner has 16 GB). An argument is a module *prefix*, so
      # the awk keeps only names that no earlier kept name is a prefix of
      # (LC_ALL=C sort puts A.B right after A) and each module is replayed
      # once; one call per prefix peaks at ~7.5 GB (Libpetri.Reference, 10
      # modules) and took ~100 s pinned to 4 cores. The root Libpetri.lean
      # only imports and declares nothing.
      - name: Kernel replay of every Libpetri module (leanchecker)
        shell: bash
        run: |
          find Libpetri -name '*.lean' | sed 's/\.lean$//; s#/#.#g' | LC_ALL=C sort \
            | awk 'prev == "" || index($0, prev ".") != 1 { print; prev = $0 }' > /tmp/lc-modules
          test -s /tmp/lc-modules
          # One process per prefix. Libpetri.Reference and the Mathlib-importing
          # Libpetri.Novel prefixes peak at 4 to 37 GB of resident memory (mostly
          # mapped .olean files), so they run one at a time; every other prefix peaks
          # under 3 GB and runs three at a time. All serial took about 15 min.
          grep -E '^Libpetri\.(Reference|Novel)(\.|$)' /tmp/lc-modules > /tmp/lc-heavy || true
          grep -vE '^Libpetri\.(Reference|Novel)(\.|$)' /tmp/lc-modules > /tmp/lc-light
          xargs -n 1 lake env leanchecker < /tmp/lc-heavy
          xargs -P 3 -n 1 lake env leanchecker < /tmp/lc-light
          echo "leanchecker: replayed $(wc -l < /tmp/lc-modules) module prefixes"
      # A `sorry` still builds (with a warning), so the build alone is not a
      # gate. Both checks below are: grep catches the source text, and
      # `#print axioms` catches anything that reached a theorem by any route
      # (sorryAx shows up there even if the text is generated).
      # Libpetri/Spec/Text holds the spec prose, which may use "admit" as an English word; the
      # literal-aware escape-hatch scan below still covers its code.
      - name: No sorry / admit in source
        run: '! grep -rnE --exclude-dir=Text "\bsorry\b|\badmit\b" Libpetri Libpetri.lean'
      # GitHub's implicit shell for a `run:` block is `bash -e {0}` — no
      # pipefail — so piping `lake env lean` into anything would mask its exit
      # status. `shell: bash` is `bash --noprofile --norc -eo pipefail {0}`, and
      # the redirect below avoids the pipe entirely; belt and braces, because a
      # green step that never ran is the exact failure this gate exists to stop.
      - name: Headline theorems depend on no unexpected axioms
        shell: bash
        run: |
          cat > /tmp/axioms.lean <<'EOF'
          import Libpetri
          import Libpetri.Reference
          #print axioms Libpetri.proposition_one
          #print axioms Libpetri.guard_hypothesis_is_necessary
          #print axioms Libpetri.unit_output_hypothesis_is_necessary
          #print axioms Libpetri.willFire_guard_is_necessary
          #print axioms Libpetri.false_proven_without_injection
          #print axioms Libpetri.injection_reaches_violation
          #print axioms Libpetri.token_conservation
          #print axioms Libpetri.consume_faithful
          #print axioms Libpetri.Pool.removeMatching_some
