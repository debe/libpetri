          if ! lake env lean /tmp/axioms.lean > /tmp/axioms.out 2>&1; then
            cat /tmp/axioms.out
            echo "axiom check: lake env lean failed — a listed theorem was" \
                 "renamed, moved out of the Libpetri namespace, or deleted."
            exit 1
          fi
          cat /tmp/axioms.out
          ! grep -q "sorryAx" /tmp/axioms.out
          # Every `#print axioms` must have produced a report line ('Name' ...).
          # Without this a truncated or empty output passes the grep above
          # *because* the check did not run.
          want=$(grep -c '^#print axioms' /tmp/axioms.lean)
          got=$(grep -c "^'" /tmp/axioms.out || true)
          if [ "$got" -ne "$want" ]; then
            echo "axiom check reported $got of $want theorems — the check did not run"
            exit 1
          fi
          echo "axiom check: $got theorems reported, no sorryAx"
      # The proofs cite shipped Rust functions; the pins in lean/fidelity.toml
      # hash those functions so a change to modeled code fails CI until the
      # model is consciously re-verified (workflow in lean/README.md).
      - name: Lean fidelity pins match cited Rust source
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest scripts/test_lean_fidelity_check.py
          python3 scripts/lean-fidelity-check.py
      # spec/coverage-matrix.md is generated; keep it in lockstep with the
      # spec index, lean/proof-coverage.json, and the test suites.
      - name: Spec coverage matrix is up to date
        working-directory: ${{ github.workspace }}
        run: python3 scripts/spec-coverage-matrix.py --check
      # lean/graph/ and docs/proof-graph/ are generated from the build;
      # regenerating them must be a no-op.
      - name: Proof graph is up to date
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m unittest scripts/test_proof_graph.py
          bash scripts/regen-proof-graph.sh
          git diff --exit-code -- lean/graph docs/proof-graph
          test -z "$(git status --porcelain -- lean/graph docs/proof-graph)"

  # Guards the doc-generator viewer bundle (petrinet-diagrams.js): the baked
  # Graphviz-WASM must instantiate + render, and the committed assets must be
  # the reproducible output of the locked toolchain (no silent dep drift).
  # Conformance against the verified Lean reference (spec/verification-fixtures/conformance/):
  # the Lean binary re-derives every expected verdict (freshness), then each language's verifier
  # runs the corpus on every route and must never contradict the reference, and every Violated
  # trace it reports is replayed by the verified firing rule. LIBPETRI_CONFORMANCE_REQUIRE=1 turns
  # a missing corpus into a failure, and an empty trace dump fails the replay step.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBPETRI_CONFORMANCE_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install elan
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ runner.os }}-${{ hashFiles('lean/lake-manifest.json') }}
      - name: Fetch Lean dependencies (imported Mathlib closure only)
        working-directory: lean
        run: bash ../scripts/lean-ci-deps.sh
      - name: Build the Lean reference
        working-directory: lean
        run: lake build reference
      - uses: ./.github/actions/install-z3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-java@v6
        with:
          java-version: '25-ea'
          distribution: 'temurin'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Expected verdicts are fresh (re-derived by the Lean reference)
        run: python3 scripts/conformance-corpus.py --check
      - run: python3 scripts/conformance-replay.py --lang rust
      - run: python3 scripts/conformance-replay.py --lang java
      - name: TypeScript dependencies
        working-directory: typescript
        run: npm ci
      - run: python3 scripts/conformance-replay.py --lang ts
      - name: Python wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest pytest-asyncio
          maturin build --release --locked --out dist --compatibility pypi
          python -m pip install dist/libpetri-*.whl
      - run: python3 scripts/conformance-replay.py --lang py

  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      # `--with-deps` runs `apt-get update`, which on the runner image also hits
      # Google's chrome-stable repo. That repo intermittently serves a
      # Packages.gz whose digest does not match its Release file, and apt then
      # exits 100 and fails the job. Nothing here installs from it (Chromium
      # comes from Playwright's own CDN), so drop the source list first.
      - name: Install Chromium for the headless render smoke test
        run: |
          lists=$(grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null || true)
          if [ -n "$lists" ]; then sudo rm -f $lists; fi
          npx playwright install --with-deps chromium
      # Builds the viewer IIFE, validates the embedded WASM (check-viewer-wasm),
      # and distributes the byte-identical bundle to all three resource dirs.
      - run: bash ../scripts/build-viewer.sh
      # Headless render in a real WASM engine: asserts an <svg> actually appears.
      - run: npm run smoke:viewer
      # Anti-drift: the just-rebuilt assets must match what is committed. Fails
      # if a @viz-js/viz / esbuild bump was merged without rebuilding the bundle.
      - name: No viewer-asset drift (committed == rebuilt from locked deps)
        run: |
          git -C .. diff --exit-code -- \
            java/src/main/resources/javadoc/petrinet-diagrams.js \
            java/src/main/resources/javadoc/petrinet-diagrams.css \
            rust/libpetri-docgen/resources/petrinet-diagrams.js \
            rust/libpetri-docgen/resources/petrinet-diagrams.css \
            typescript/src/doclet/resources/petrinet-diagrams.js \
            typescript/src/doclet/resources/petrinet-diagrams.css

  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      # The skill in plugins/libpetri/skills/ is loaded by Claude Code, Codex,
      # opencode and oh-my-pi. opencode drops a skill SILENTLY when its
      # description exceeds 1024 chars or its name does not match its directory,
      # and `claude plugin validate` passes on both, so this is the only gate
      # that catches it. Also asserts .agents/skills/ is still a resolving
      # symlink: a Windows checkout without core.symlinks turns it into a text
      # file, which stops the skill loading in all three non-Claude harnesses.
      - run: python scripts/check-agent-skills.py
