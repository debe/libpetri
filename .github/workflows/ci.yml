          #print axioms Libpetri.fireConsume_dirty_sound
          #print axioms Libpetri.updateEnablement_sync
          #print axioms Libpetri.precompiled_refines_bitmap_immediate
          #print axioms Libpetri.collect_ready_general_refines
          #print axioms Libpetri.tid_order_diverges
          #print axioms Libpetri.read_reset_order_diverges
          #print axioms Libpetri.canEnable_insufficient_for_totality
          #print axioms Libpetri.unknown_place_drop
          #print axioms Libpetri.deadline_reap_dirty_diverges
          #print axioms Libpetri.bb_never_fires_after_reap
          #print axioms Libpetri.pb_update_reenables
          #print axioms Libpetri.invariant_strengthening_sound
          #print axioms Libpetri.strengthened_reach_eq
          #print axioms Libpetri.strengthened_reach_eq_inj
          #print axioms Libpetri.injection_hypothesis_is_necessary
          #print axioms Libpetri.consume_all_hypothesis_is_necessary
          #print axioms Libpetri.bad_rule_nonvacuity
          #print axioms Libpetri.match_cache_lockstep
          #print axioms Libpetri.fire_muts_lockstep
          #print axioms Libpetri.sync_seed
          #print axioms Libpetri.one_exactly_is_necessary
          #print axioms Libpetri.sole_consumer_is_necessary
          #print axioms Libpetri.no_reset_is_necessary
          #print axioms Libpetri.wJoinOne_is_fast_path
          #print axioms Libpetri.reap_dirty_is_the_asymmetry
          #print axioms Libpetri.no_reap_frame
          #print axioms Libpetri.bad_rule_proves_every_net
          #print axioms Libpetri.invariant_strengthening_sound_inj
          #print axioms Libpetri.semiflow_union_sound
