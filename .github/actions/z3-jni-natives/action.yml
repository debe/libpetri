# The SMT verifier binds com.microsoft.z3 through JNI, but the
# javasmt-solver-z3 artifact ships only the Java classes — the natives it
# calls (libz3java.so, libz3.so) are not a Maven dependency. Without them
# every @EnabledIf("z3Available") suite skips silently: 47 of 136 tests,
# the whole certificate-check / replay / verdict-parity feature. The version
# must track javasmt-z3.version in java/pom.xml, since the JNI symbol set is
# version-specific; on Linux the JVM seeds java.library.path from
# LD_LIBRARY_PATH, so no argLine override is needed and JaCoCo stays intact.
# Z3NativeGateTest fails the build if the natives still do not load.
#
# This lives in a composite action because every workflow that runs
# `./mvnw verify` needs it, and a workflow that forgets it fails on
# Z3NativeGateTest rather than skipping quietly — which is exactly how the
# weekly JMH run broke.
name: Install z3 JNI natives
description: Put libz3java.so on LD_LIBRARY_PATH so com.microsoft.z3 loads.

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        set -euo pipefail
        version=$(sed -n 's|.*<javasmt-z3.version>\(.*\)</javasmt-z3.version>.*|\1|p' \
          "$GITHUB_WORKSPACE/java/pom.xml")
        url=$(curl -fsSL "https://api.github.com/repos/Z3Prover/z3/releases/tags/z3-$version" \
          | grep -o 'https://[^"]*x64-glibc[^"]*\.zip' | head -1)
        test -n "$url" || { echo "no x64-glibc asset for z3-$version"; exit 1; }
        curl -fsSL -o z3.zip "$url"
        unzip -q z3.zip
        bin=$(dirname "$(find . -name libz3java.so -print -quit)")
        test -f "$bin/libz3java.so" || { echo "libz3java.so missing from $url"; exit 1; }
        echo "LD_LIBRARY_PATH=$PWD/${bin#./}" >> "$GITHUB_ENV"
